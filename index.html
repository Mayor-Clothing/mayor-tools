<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayor Invoice Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f4; color: #1a1a18; padding: 2rem 1rem; }
  .container { max-width: 600px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .section-title { font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .field { margin-bottom: 10px; }
  label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
  input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 13px; font-family: inherit; background: #fff; color: #1a1a18; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, textarea:focus { outline: 2px solid #378add; outline-offset: 1px; }
  input[readonly] { background: #f9f9f8; color: #555; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button.primary { width: 100%; padding: 11px; font-size: 14px; font-family: inherit; border: none; border-radius: 8px; background: #1a1a18; color: white; cursor: pointer; }
  button.primary:hover { background: #333; }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.secondary { width: 100%; padding: 10px; font-size: 13px; font-family: inherit; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #1a1a18; cursor: pointer; }
  button.secondary:hover { background: #f5f5f4; }
  .status { margin-top: 10px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .success { background: #eaf3de; color: #3b6d11; display: block; }
  .error   { background: #fcebeb; color: #a32d2d; display: block; }
  .loading { background: #e6f1fb; color: #185fa5; display: block; }
  .toggle { font-size: 12px; color: #888; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; margin-top: 4px; width: auto; }
  .item-block { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #f0f0ee; }
  .item-block:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .item-label { font-size: 11px; font-weight: 500; color: #666; margin-bottom: 6px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; }
  .checkbox-row input[type="checkbox"] { width: auto; margin: 0; }
  .checkbox-row label { font-size: 12px; color: #666; margin: 0; white-space: nowrap; }
  .subtotal-display { background: #f9f9f8; border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; justify-content: space-between; margin-top: 8px; }
  .subtotal-display span:first-child { color: #888; }
  .subtotal-display span:last-child { font-weight: 500; }
  .paste-area { min-height: 100px; font-size: 12px; font-family: monospace; }
  .parse-info { font-size: 11px; color: #3b6d11; margin-top: 6px; display: none; }
</style>
</head>
<body>
<div class="container">
  <img src="Mayor_Logo_transparent.png" style="width:120px; margin-bottom:1.5rem; display:block;" />

  <!-- PASTE FROM HUBSPOT -->
  <div class="card">
    <p class="section-title">Paste from HubSpot</p>
    <div class="field">
      <label>Copy the invoice section from HubSpot and paste it here</label>
      <textarea id="hubspot-paste" class="paste-area" placeholder="Paste HubSpot invoice data here…"></textarea>
    </div>
    <button class="secondary" onclick="parseHubspot()">Auto-fill from HubSpot data</button>
    <div class="parse-info" id="parse-info"></div>
  </div>

  <!-- ORDER INFO -->
  <div class="card">
    <p class="section-title">Order Info</p>
    <div class="row2">
      <div class="field"><label>Order Number</label><input id="order_number" /></div>
      <div class="field"><label>Club</label><input id="club" /></div>
    </div>
    <div class="field">
      <label>Shipping / Billing Address</label>
      <textarea id="address" rows="3" placeholder="Club Name&#10;Attn: Name&#10;Street&#10;City, State ZIP&#10;Phone"></textarea>
    </div>
    <div class="row2">
      <div class="field"><label>Ship Date</label><input id="ship_date" placeholder="Friday, May 29, 2026" /></div>
      <div class="field"><label>Payment Link (Nickel)</label><input id="payment_link" placeholder="https://nickel.com/pay/..." /></div>
    </div>
  </div>

  <!-- LINE ITEMS -->
  <div class="card">
    <p class="section-title">Line Items</p>
    <div id="items-container"></div>
    <div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;">
      <button class="toggle" id="btn-add" onclick="addItem()">+ Add item</button>
      <button class="toggle" id="btn-remove" onclick="removeItem()" style="display:none;">− Remove last item</button>
    </div>
    <div style="margin-top:14px; padding-top:14px; border-top:1px solid #f0f0ee;">
      <div class="row2">
        <div class="subtotal-display"><span>Total Quantity</span><span id="total-qty-display">0</span></div>
        <div class="subtotal-display"><span>Subtotal Price</span><span id="total-price-display">$0.00</span></div>
      </div>
    </div>
  </div>

  <!-- FEES -->
  <div class="card">
    <p class="section-title">Fees</p>
    <div class="row2">
      <div class="field"><label>Embroidery Fee</label><input id="embroidery" type="number" step="0.01" placeholder="0.00" oninput="calcTotals()" /></div>
      <div class="field"><label>Art Fee</label><input id="art_setup" type="number" step="0.01" placeholder="0.00" oninput="calcTotals()" /></div>
    </div>
    <div class="row2" style="margin-top:4px;">
      <div class="checkbox-row">
        <input type="checkbox" id="strike_embroidery" checked />
        <label for="strike_embroidery">Cross out embroidery</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="strike_art" checked />
        <label for="strike_art">Cross out art fee</label>
      </div>
    </div>
  </div>

  <!-- TOTALS -->
  <div class="card">
    <p class="section-title">Totals</p>
    <div class="row3">
      <div class="field"><label>Shipping</label><input id="shipping" type="number" step="0.01" placeholder="0.00" oninput="calcTotals()" /></div>
      <div class="field"><label>Subtotal (auto)</label><input id="subtotal" type="number" step="0.01" readonly /></div>
      <div class="field"><label>Total (auto)</label><input id="total" type="number" step="0.01" readonly /></div>
    </div>
  </div>

  <button class="primary" id="gen-btn" onclick="generate()">Generate Invoice PDF</button>
  <div class="status" id="status"></div>
</div>

<script>
let itemCount = 0;

// ── HUBSPOT PARSER ──
function parseHubspot() {
  const raw = document.getElementById('hubspot-paste').value;
  if (!raw.trim()) return;

  const lines = raw.split('\n').map(l => l.trim());
  const data = {};

  for (let i = 0; i < lines.length; i++) {
    // Match "Details" or "* Details"
    const stripped = lines[i].replace(/^\*\s*/, '').trim();
    if (stripped.toLowerCase() === 'details' && i + 1 < lines.length) {
      // Find label above (skip blank lines)
      let labelIdx = i - 1;
      while (labelIdx >= 0 && lines[labelIdx] === '') labelIdx--;
      if (labelIdx >= 0) {
        const label = lines[labelIdx].replace(/^\*\s*/, '').trim();
        // Get value — if next line is blank, try the line after
        let value = lines[i + 1] ? lines[i + 1].trim() : '';
        if (!value && i + 2 < lines.length) value = lines[i + 2].trim();
        data[label] = value;
      }
    }
  }

  console.log('Parsed fields:', data);

  function get(prefix) {
    for (const key of Object.keys(data)) {
      if (key.toLowerCase().startsWith(prefix.toLowerCase())) return data[key] || '';
    }
    return '';
  }

  const orderNum = get('a. Order');
  const club     = get('b. Club');
  const address  = get('c. Shipping');
  const shipDate = get('d. Shipping');
  const payLink  = get('y. Payment');

  if (orderNum) document.getElementById('order_number').value = orderNum;
  if (club)     document.getElementById('club').value = club;

  if (address && address !== '--') {
    // Split smashed HubSpot address into lines
    let addrFormatted = address
      .replace(/([a-z])([A-Z])/g, '$1\n$2')          // camelCase joins e.g. ShopHawks
      .replace(/([a-zA-Z])(\d{3,})/g, '$1\n$2')     // letter before street number
      .replace(/(\d{5})\s*\(/g, '$1\n(')           // zip then phone
      .replace(/\s+([a-zA-Z0-9._%+\-]+@)/g, '\n$1') // emails
      .replace(/\n+/g, '\n').trim();
    document.getElementById('address').value = addrFormatted;
  }

  if (shipDate && shipDate !== '--') document.getElementById('ship_date').value = shipDate;
  if (payLink  && payLink  !== '--' && payLink !== '') document.getElementById('payment_link').value = payLink;

  const urls   = ['e. Product #1','f. Product #2','g. Product #3'].map(k => get(k));
  const descs  = ['h. Description #1','i. Description #2','j. Description #3'].map(k => get(k));
  const qtys   = ['k. Quantity #1','l. Quantity #2','m. Quantity #3','n. Quantity #4','o. Quantity #5'].map(k => parseFloat((get(k)||'').replace(/[^0-9.]/g,'')) || 0);
  const prices = ['p. Price #1','q. Price #2','r. Price #3','s. Price #4','t. Price #5'].map(k => parseFloat((get(k)||'').replace(/[^0-9.]/g,'')) || 0);

  const shippingVal = get('w. Shipping');
  if (shippingVal && shippingVal !== '--') {
    const sv = parseFloat(shippingVal.replace(/[^0-9.]/g,'')) || 0;
    if (sv > 0) document.getElementById('shipping').value = sv;
  }

  // Count items: any with qty>0 OR a real description
  let numItems = 0;
  for (let i = 0; i < 5; i++) {
    if (qtys[i] > 0 || (descs[i] && descs[i] !== '--')) numItems = i + 1;
  }
  numItems = Math.max(1, numItems);

  document.getElementById('items-container').innerHTML = '';
  itemCount = 0;
  for (let i = 0; i < numItems; i++) {
    addItem();
    const n = i + 1;
    if (urls[i]   && urls[i]   !== '--') document.getElementById('url_'   + n).value = urls[i];
    if (descs[i]  && descs[i]  !== '--') document.getElementById('desc_'  + n).value = descs[i].replace(/ \/ /g, '\n');
    if (qtys[i] > 0)   document.getElementById('qty_' + n).value = qtys[i];
    // If price is $0 but a previous item had a price, treat as comped
    const firstPrice = prices.find(p => p > 0) || 0;
    if (prices[i] === 0 && firstPrice > 0 && qtys[i] > 0) {
      document.getElementById('orig_price_' + n).value = firstPrice.toFixed(2);
      document.getElementById('price_' + n).value = '0';
    } else if (prices[i] > 0) {
      document.getElementById('price_' + n).value = prices[i];
    }
    calcItem(n);
  }

  calcTotals();
  const info = document.getElementById('parse-info');
  info.style.display = 'block';
  info.textContent = '✓ Filled ' + numItems + ' item' + (numItems > 1 ? 's' : '') + ' — review and adjust as needed';
}

// ── ITEM MANAGEMENT ──
function addItem() {
  itemCount++;
  const n = itemCount;
  const div = document.createElement('div');
  div.className = 'item-block';
  div.id = 'item-block-' + n;
  div.innerHTML = `
    <p class="item-label">Item ${n}</p>
    <div class="field"><label>Product URL</label><input id="url_${n}" placeholder="https://mayorclothing.com/products/..." /></div>
    <div class="field"><label>Description (verbatim)</label><textarea id="desc_${n}" rows="4"></textarea></div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;">
      <div class="field"><label>Qty</label><input id="qty_${n}" type="number" placeholder="24" oninput="calcItem(${n})" /></div>
      <div class="field"><label>Original Price (struck)</label><input id="orig_price_${n}" type="number" step="0.01" placeholder="optional" /></div>
      <div class="field"><label>Actual Price</label><input id="price_${n}" type="number" step="0.01" placeholder="49.00" oninput="calcItem(${n})" /></div>
      <div class="field"><label>Amount (auto)</label><input id="amount_${n}" type="number" step="0.01" readonly /></div>
    </div>`;
  document.getElementById('items-container').appendChild(div);
  document.getElementById('btn-remove').style.display = itemCount > 1 ? '' : 'none';
}

function removeItem() {
  if (itemCount < 2) return;
  document.getElementById('item-block-' + itemCount).remove();
  itemCount--;
  document.getElementById('btn-remove').style.display = itemCount > 1 ? '' : 'none';
  calcTotals();
}

function calcItem(n) {
  const qty   = parseFloat(document.getElementById('qty_' + n).value) || 0;
  const price = parseFloat(document.getElementById('price_' + n).value) || 0;
  const amt   = qty * price;
  document.getElementById('amount_' + n).value = amt > 0 ? amt.toFixed(2) : '';
  calcTotals();
}

function calcTotals() {
  let totalQty = 0, totalAmt = 0;
  for (let i = 1; i <= itemCount; i++) {
    totalQty += parseFloat(document.getElementById('qty_' + i)?.value) || 0;
    totalAmt += parseFloat(document.getElementById('amount_' + i)?.value) || 0;
  }
  document.getElementById('total-qty-display').textContent = totalQty;
  document.getElementById('total-price-display').textContent = '$' + totalAmt.toFixed(2);
  document.getElementById('subtotal').value = totalAmt > 0 ? totalAmt.toFixed(2) : '';
  const shipping = parseFloat(document.getElementById('shipping').value) || 0;
  const grandTotal = totalAmt + shipping;
  document.getElementById('total').value = grandTotal > 0 ? grandTotal.toFixed(2) : '';
}

function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function num(id) { const el = document.getElementById(id); return parseFloat(el?.value) || 0; }
function checked(id) { const el = document.getElementById(id); return el ? el.checked : false; }

async function generate() {
  const btn = document.getElementById('gen-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status loading';
  status.textContent = 'Generating invoice…';

  const lineItems = [];
  for (let i = 1; i <= itemCount; i++) {
    const qty = num('qty_' + i);
    const desc = val('desc_' + i);
    if (!qty && !desc) continue;
    lineItems.push({
      product: 'Custom Print Polo',
      url: val('url_' + i),
      description: desc,
      quantity: qty,
      orig_price: num('orig_price_' + i) || null,
      price: num('price_' + i),
      amount: num('amount_' + i)
    });
  }

  const payload = {
    order_number: val('order_number'),
    club:         val('club'),
    address:      val('address'),
    ship_date:    val('ship_date'),
    payment_link: val('payment_link'),
    line_items:   lineItems,
    subtotal:     num('subtotal'),
    embroidery:   num('embroidery') || null,
    strike_embroidery: checked('strike_embroidery'),
    art_setup:    num('art_setup') || null,
    strike_art:   checked('strike_art'),
    shipping:     num('shipping'),
    total:        num('total')
  };

  try {
    const res = await fetch('https://mayor-invoice.onrender.com/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Mayor-Invoice-${payload.order_number || 'draft'}.pdf`;
    a.click();
    status.className = 'status success';
    status.textContent = '✓ Invoice downloaded!';
  } catch(e) {
    status.className = 'status error';
    status.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// Start with 1 item
addItem();
</script>
</body>
</html>
