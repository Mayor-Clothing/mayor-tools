<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayor Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- ── SHARED BASE STYLES (invoice generator, unchanged) ── -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f4; color: #1a1a18; }

  /* ── Top nav ── */
  .top-nav {
    background: #1a1a18; color: white;
    display: flex; align-items: center; gap: 0;
    position: sticky; top: 0; z-index: 200;
  }
  .top-nav .logo-area {
    padding: 12px 20px; border-right: 1px solid #333;
    display: flex; align-items: center;
  }
  .top-nav .logo-area img { height: 28px; display: block; }
  .nav-tab {
    padding: 14px 22px; cursor: pointer; font-size: 13px; font-weight: 500;
    color: #aaa; border-bottom: 3px solid transparent; transition: color .15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; white-space: nowrap;
  }
  .nav-tab:hover { color: #fff; }
  .nav-tab.active { color: #fff; border-bottom-color: #fff; }

  /* ── Pages ── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── Invoice generator styles (verbatim from original) ── */
  #page-invoice { padding: 2rem 1rem; }
  #page-invoice .container { max-width: 600px; margin: 0 auto; }
  #page-invoice .card { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  #page-invoice .section-title { font-size: 11px; font-weight: 500; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  #page-invoice .field { margin-bottom: 10px; }
  #page-invoice label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
  #page-invoice input, #page-invoice textarea, #page-invoice select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 13px; font-family: inherit; background: #fff; color: #1a1a18; }
  #page-invoice input[type="number"] { -moz-appearance: textfield; }
  #page-invoice input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
  #page-invoice textarea { resize: vertical; min-height: 60px; }
  #page-invoice input:focus, #page-invoice textarea:focus { outline: 2px solid #378add; outline-offset: 1px; }
  #page-invoice input[readonly] { background: #f9f9f8; color: #555; }
  #page-invoice .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #page-invoice .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  #page-invoice button.primary { width: 100%; padding: 11px; font-size: 14px; font-family: inherit; border: none; border-radius: 8px; background: #1a1a18; color: white; cursor: pointer; }
  #page-invoice button.primary:hover { background: #333; }
  #page-invoice button.primary:disabled { opacity: 0.5; cursor: default; }
  #page-invoice button.secondary { width: 100%; padding: 10px; font-size: 13px; font-family: inherit; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #1a1a18; cursor: pointer; }
  #page-invoice button.secondary:hover { background: #f5f5f4; }
  #page-invoice .status { margin-top: 10px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  #page-invoice .success { background: #eaf3de; color: #3b6d11; display: block; }
  #page-invoice .error   { background: #fcebeb; color: #a32d2d; display: block; }
  #page-invoice .loading { background: #e6f1fb; color: #185fa5; display: block; }
  #page-invoice .toggle { font-size: 12px; color: #888; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; margin-top: 4px; width: auto; }
  #page-invoice .item-block { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #f0f0ee; }
  #page-invoice .item-block:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  #page-invoice .item-label { font-size: 11px; font-weight: 500; color: #666; margin-bottom: 6px; }
  #page-invoice .checkbox-row { display: flex; align-items: center; gap: 6px; }
  #page-invoice .checkbox-row input[type="checkbox"] { width: auto; margin: 0; }
  #page-invoice .checkbox-row label { font-size: 12px; color: #666; margin: 0; white-space: nowrap; }
  #page-invoice .subtotal-display { background: #f9f9f8; border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; justify-content: space-between; margin-top: 8px; }
  #page-invoice .subtotal-display span:first-child { color: #888; }
  #page-invoice .subtotal-display span:last-child { font-weight: 500; }
  #page-invoice .paste-area { min-height: 100px; font-size: 12px; font-family: monospace; }
  #page-invoice .parse-info { font-size: 11px; color: #3b6d11; margin-top: 6px; display: none; }

  /* ── PO generator styles ── */
  #page-po .po-topbar {
    background: #1a1a18; color: white; padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  #page-po .po-topbar-actions { display: flex; gap: 8px; }
  #page-po .btn { padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; transition: background .15s; }
  #page-po .btn-primary { background: white; color: #1a1a18; }
  #page-po .btn-primary:hover { background: #e5e5e3; }
  #page-po .btn-primary:disabled { opacity: .5; cursor: default; }
  #page-po .btn-secondary { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
  #page-po .btn-secondary:hover { background: rgba(255,255,255,0.25); }
  #page-po .btn-red { background: white; color: #a32d2d; border: 1px solid #ddd; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  #page-po .btn-red:hover { background: #fcebeb; }
  #page-po .btn-add { background: none; border: none; color: #999; font-size: 12px; padding: 4px 0; cursor: pointer; font-family: inherit; text-decoration: underline; }
  #page-po .btn-add:hover { color: #1a1a18; }
  #page-po .btn-remove { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
  #page-po .btn-remove:hover { color: #a32d2d; }

  #page-po .po-tabs-row { background: #fff; border-bottom: 1px solid #e5e5e3; padding: 0 24px; display: flex; align-items: center; overflow-x: auto; }
  #page-po .po-tab { padding: 11px 18px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 400; color: #999; white-space: nowrap; margin-bottom: -1px; }
  #page-po .po-tab.active { border-bottom-color: #1a1a18; color: #1a1a18; font-weight: 500; }
  #page-po .po-tab:hover:not(.active) { color: #555; }
  #page-po .po-tab-add-btn { padding: 8px 14px; cursor: pointer; color: #bbb; font-size: 20px; line-height: 1; background: none; border: none; }
  #page-po .po-tab-add-btn:hover { color: #1a1a18; }

  #page-po .form-area { padding: 24px; max-width: 1100px; margin: 0 auto; }
  #page-po .colorway-panel { display: none; }
  #page-po .colorway-panel.active { display: block; }
  #page-po .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  #page-po .panel-header h2 { font-size: 13px; font-weight: 500; color: #999; }
  #page-po .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  #page-po .form-section { background: #fff; border-radius: 12px; border: 1px solid #e5e5e3; padding: 16px; margin-bottom: 16px; }
  #page-po .form-section h3 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: #555; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0ee; }
  #page-po .field-row { margin-bottom: 10px; }
  #page-po .field-row label { display: block; font-size: 12px; color: #444; margin-bottom: 4px; }
  #page-po .field-row input[type=text],
  #page-po .field-row input[type=number],
  #page-po .field-row textarea { width: 100%; border: 1px solid #ddd; border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; background: #fff; color: #1a1a18; }
  #page-po .field-row input[type=text]:focus,
  #page-po .field-row input[type=number]:focus,
  #page-po .field-row textarea:focus { outline: 2px solid #378add; outline-offset: 1px; border-color: transparent; }
  #page-po .field-row input[readonly] { background: #f9f9f8; color: #555; }
  #page-po .field-row.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #page-po .sizes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  #page-po .size-field label { display: block; font-size: 12px; color: #444; margin-bottom: 4px; }
  #page-po .size-field input { width: 100%; border: 1px solid #ddd; border-radius: 7px; padding: 7px 6px; font-size: 13px; font-family: inherit; text-align: center; }
  #page-po .size-field input:focus { outline: 2px solid #378add; outline-offset: 1px; border-color: transparent; }
  #page-po .color-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #page-po .color-row input { flex: 1; border: 1px solid #ddd; border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit; }
  #page-po .color-row input.hex-input { max-width: 110px; }
  #page-po .color-row input:focus { outline: 2px solid #378add; outline-offset: 1px; border-color: transparent; }
  #page-po .emb-file-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #page-po .emb-file-row input { flex: 1; border: 1px solid #ddd; border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit; }
  #page-po .emb-file-row input:focus { outline: 2px solid #378add; outline-offset: 1px; border-color: transparent; }
  #page-po .mockup-preview { margin-top: 8px; }
  #page-po .mockup-preview img { max-height: 120px; border: 1px solid #e5e5e3; border-radius: 7px; display: none; }
  #page-po .static-editable { background: #f9f9f8; border: 1px solid #e5e5e3; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  #page-po .static-editable h4 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: #555; margin-bottom: 6px; }
  #page-po .static-editable .static-content { font-size: 12px; color: #444; line-height: 1.7; }
  #page-po .static-editable .static-content a { color: #378add; }
  #page-po .static-editable .edit-bar { margin-top: 8px; display: flex; justify-content: flex-end; }
  #page-po .btn-edit { background: none; border: 1px solid #ddd; border-radius: 6px; color: #888; font-size: 11px; padding: 3px 10px; cursor: pointer; font-family: inherit; }
  #page-po .btn-edit:hover { background: #f0f0ee; color: #1a1a18; }
  #page-po .static-edit-form { display: none; margin-top: 10px; border-top: 1px solid #e5e5e3; padding-top: 10px; }
  #page-po .static-edit-form.open { display: block; }
  #page-po .static-edit-form input[type=text] { width: 100%; border: 1px solid #ddd; border-radius: 7px; padding: 7px 10px; font-size: 12px; font-family: inherit; margin-bottom: 6px; }
  #page-po .static-edit-form input[type=text]:focus { outline: 2px solid #378add; outline-offset: 1px; border-color: transparent; }
  #page-po .static-edit-form label { font-size: 12px; color: #666; display: block; margin-bottom: 3px; }
  #page-po .btn-save-edit { background: #1a1a18; color: white; border: none; border-radius: 7px; font-size: 12px; padding: 6px 14px; cursor: pointer; font-family: inherit; margin-right: 6px; }
  #page-po .btn-save-edit:hover { background: #333; }
  #page-po .btn-cancel-edit { background: none; border: 1px solid #ddd; border-radius: 7px; color: #666; font-size: 12px; padding: 6px 12px; cursor: pointer; font-family: inherit; }
  #page-po .btn-cancel-edit:hover { background: #f5f5f4; }
  #page-po .fully-static { background: #f9f9f8; border: 1px solid #e5e5e3; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: #777; line-height: 1.7; }
  #page-po .fully-static h4 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: #555; margin-bottom: 5px; }

  /* PDF hidden container */
  #pdf-pages-container { position: absolute; left: -9999px; top: 0; }

  /* PDF styles */
  .pdf-page { width: 1100px; background: white; font-family: Arial, sans-serif; font-size: 12px; color: #222; padding: 32px 40px 24px 40px; }
  .pdf-title { text-align: center; font-size: 22px; font-weight: bold; color: #222; margin-bottom: 4px; font-family: Arial, sans-serif; }
  .pdf-title .po-green { color: #2e7d32; font-weight: bold; }
  .pdf-title .club-green { color: #2e7d32; font-weight: bold; }
  .pdf-subtitle { text-align: center; font-size: 14px; color: #2e7d32; margin-bottom: 10px; }
  .pdf-divider { border: none; border-top: 1px solid #aaa; margin-bottom: 16px; }
  .pdf-body { display: flex; gap: 30px; }
  .pdf-left { flex: 0 0 340px; }
  .pdf-right { flex: 1; }

  .pdf-field b { font-weight: bold; }
  .pdf-field .g { color: #2e7d32; }
  .pdf-field a { color: #2e7d32; text-decoration: underline; }
  .pdf-section-title { text-align: center; font-weight: bold; font-size: 13px; margin: 12px 0 6px 0; }
  .pdf-sizes .size-line { margin-bottom: 2px; }
  .pdf-mat-row { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
  .pdf-mat-row .mat-text { flex: 1; line-height: 1.6; }
  .pdf-label-img { width: 80px; height: 54px; object-fit: cover; border: 1px solid #ddd; flex-shrink: 0; }

  .pdf-billing .billing-title { font-weight: bold; text-align: center; margin-bottom: 4px; }

</style>
</head>
<body>

<!-- ── TOP NAV ── -->
<nav class="top-nav">
  <div class="logo-area">
    <img src="Mayor_Logo_transparent.png" alt="Mayor">
  </div>
  <button class="nav-tab active" id="nav-invoice" onclick="switchPage('invoice')">Invoice Generator</button>
  <button class="nav-tab" id="nav-po" onclick="switchPage('po')">PO Generator</button>
</nav>

<!-- ══════════════════════════════════════════════
     PAGE 1 — INVOICE GENERATOR (untouched)
═══════════════════════════════════════════════ -->
<div class="page active" id="page-invoice">
<div class="container">

  <!-- PASTE FROM HUBSPOT -->
  <div class="card">
    <p class="section-title">Paste from HubSpot</p>
    <div class="field">
      <label>Copy the invoice section from HubSpot and paste it here</label>
      <textarea id="hubspot-paste" class="paste-area" placeholder="Paste HubSpot invoice data here…"></textarea>
    </div>
    <button class="secondary" onclick="parseHubspot()">Auto-fill from HubSpot data</button>
    <div class="parse-info" id="parse-info"></div>
  </div>

  <!-- DOCUMENT TYPE TOGGLE -->
  <div class="card">
    <p class="section-title">Document Type</p>
    <div style="display:flex; gap:10px;">
      <button id="btn-confirmation" onclick="setDocType('confirmation')" style="flex:1; padding:10px; font-family:inherit; font-size:13px; border-radius:8px; border:2px solid #1a1a18; background:#1a1a18; color:white; cursor:pointer;">Order Confirmation</button>
      <button id="btn-invoice" onclick="setDocType('invoice')" style="flex:1; padding:10px; font-family:inherit; font-size:13px; border-radius:8px; border:2px solid #ccc; background:white; color:#1a1a18; cursor:pointer;">Invoice</button>
    </div>
  </div>

  <!-- ORDER INFO -->
  <div class="card">
    <p class="section-title">Order Info</p>
    <div class="row2">
      <div class="field"><label>Order Number</label><input id="order_number" /></div>
      <div class="field"><label>Club</label><input id="club" /></div>
    </div>
    <div class="field">
      <label>Shipping / Billing Address</label>
      <textarea id="address" rows="3" placeholder="Club Name&#10;Attn: Name&#10;Street&#10;City, State ZIP&#10;Phone"></textarea>
    </div>
    <div class="row2">
      <div class="field"><label>Ship Date</label><input id="ship_date" placeholder="Friday, May 29, 2026" /></div>

    </div>
    <div class="field">
      <label>Customer Email</label>
      <input id="customer_email" type="email" placeholder="timfleming@okccgc.com" />
    </div>
    <div class="field">
      <label>Product Page URL</label>
      <input id="product_page" placeholder="https://mayorclothing.com/products/..." />
    </div>
  </div>

  <!-- LINE ITEMS -->
  <div class="card">
    <p class="section-title">Line Items</p>
    <div id="items-container"></div>
    <div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;">
      <button class="toggle" id="btn-add" onclick="addItem()">+ Add item</button>
      <button class="toggle" id="btn-remove" onclick="removeItem()" style="display:none;">− Remove last item</button>
    </div>
    <div style="margin-top:14px; padding-top:14px; border-top:1px solid #f0f0ee;">
      <div class="row2">
        <div class="subtotal-display"><span>Total Quantity</span><span id="total-qty-display">0</span></div>
        <div class="subtotal-display"><span>Subtotal Price</span><span id="total-price-display">$0.00</span></div>
      </div>
    </div>
  </div>

  <!-- FEES -->
  <div class="card">
    <p class="section-title">Fees</p>
    <div class="row2">
      <div class="field"><label>Embroidery Fee</label><input id="embroidery" type="number" step="0.01" placeholder="0.00" oninput="calcTotals()" /></div>
      <div class="field"><label>Art Fee</label><input id="art_setup" type="number" step="0.01" placeholder="0.00" oninput="calcTotals()" /></div>
    </div>
    <div class="row2" style="margin-top:4px;">
      <div class="checkbox-row">
        <input type="checkbox" id="strike_embroidery" checked />

      </div>

        <input type="checkbox" id="strike_art" checked />

    <p class="section-title">Totals</p>

  <div class="status" id="status"></div>

<script>
// ══════════════════════════════════════════════
// PAGE SWITCHING
// ══════════════════════════════════════════════
function switchPage(page) {
  document.getElementById('page-invoice').classList.toggle('active', page === 'invoice');
  document.getElementById('page-po').classList.toggle('active', page === 'po');
  document.getElementById('nav-invoice').classList.toggle('active', page === 'invoice');
  document.getElementById('nav-po').classList.toggle('active', page === 'po');
}


// ══════════════════════════════════════════════
// INVOICE GENERATOR (verbatim, untouched)
// ══════════════════════════════════════════════
let itemCount = 0;

function parseHubspot() {
  const raw = document.getElementById('hubspot-paste').value;
  if (!raw.trim()) return;

  const lines = raw.split('\n').map(l => l.trim());
  const data = {};

  for (let i = 0; i < lines.length; i++) {
    const stripped = lines[i].replace(/^\*\s*/, '').trim();
    if (stripped.toLowerCase() === 'details' && i + 1 < lines.length) {
      let labelIdx = i - 1;
      while (labelIdx >= 0 && lines[labelIdx] === '') labelIdx--;
      if (labelIdx >= 0) {
        const label = lines[labelIdx].replace(/^\*\s*/, '').trim();
        let value = lines[i + 1] ? lines[i + 1].trim() : '';
        if (!value && i + 2 < lines.length) value = lines[i + 2].trim();
        data[label] = value;
      }
    }
  }

  function get(prefix) {
    for (const key of Object.keys(data)) {
      if (key.toLowerCase().startsWith(prefix.toLowerCase())) return data[key] || '';
    }
    return '';
  }

  const orderNum = get('a. Order');
  const club     = get('b. Club');
  const address  = get('c. Shipping');
  const shipDate = get('d. Shipping');
  const payLink  = get('y. Payment');

  if (orderNum) document.getElementById('order_number').value = orderNum;
  if (club)     document.getElementById('club').value = club;

  if (address && address !== '--') {
    let addrFormatted = address
      .replace(/([a-z])([A-Z])/g, '$1\n$2')
      .replace(/([a-zA-Z])(\d{3,})/g, '$1\n$2')
      .replace(/(\d{5})\s*\(/g, '$1\n(')
      .replace(/\s+([a-zA-Z0-9._%+\-]+@)/g, '\n$1')
      .replace(/\n+/g, '\n').trim();
    document.getElementById('address').value = addrFormatted;
  }

  if (shipDate && shipDate !== '--') document.getElementById('ship_date').value = shipDate;
  if (payLink  && payLink  !== '--' && payLink !== '') document.getElementById('payment_link').value = payLink;

  const productPage = get('Product Page');
  if (productPage && productPage !== '--') document.getElementById('product_page').value = productPage;

  const urls   = ['e. Product #1','f. Product #2','g. Product #3'].map(k => get(k));
  const descs  = ['h. Description #1','i. Description #2','j. Description #3'].map(k => get(k));
  const sizes  = ['Sizes #1','Sizes #2','Sizes #3','Sizes #4','Sizes #5'].map(k => get(k));
  const qtys   = ['k. Quantity #1','l. Quantity #2','m. Quantity #3','n. Quantity #4','o. Quantity #5'].map(k => parseFloat((get(k)||'').replace(/[^0-9.]/g,'')) || 0);
  const prices = ['p. Price #1','q. Price #2','r. Price #3','s. Price #4','t. Price #5'].map(k => parseFloat((get(k)||'').replace(/[^0-9.]/g,'')) || 0);

  const shippingVal = get('w. Shipping');
  if (shippingVal && shippingVal !== '--') {
    const sv = parseFloat(shippingVal.replace(/[^0-9.]/g,'')) || 0;
    if (sv > 0) document.getElementById('shipping').value = sv;
  }

  const customerEmail = get('customer_email') || get('customer email');
  if (customerEmail && customerEmail !== '--') document.getElementById('customer_email').value = customerEmail;

  const embroideryVal = get('za. Embroidery');
  if (embroideryVal && embroideryVal !== '--') {
    const ev = parseFloat(embroideryVal.replace(/[^0-9.]/g,'')) || 0;
    if (ev > 0) document.getElementById('embroidery').value = ev;
  }

  const artVal = get('zb. Art');
  if (artVal && artVal !== '--') {
    const av = parseFloat(artVal.replace(/[^0-9.]/g,'')) || 0;
    if (av > 0) document.getElementById('art_setup').value = av;
  }

  let numItems = 0;
  for (let i = 0; i < 5; i++) {
    if (qtys[i] > 0 || (descs[i] && descs[i] !== '--')) numItems = i + 1;
  }
  numItems = Math.max(1, numItems);

  document.getElementById('items-container').innerHTML = '';
  itemCount = 0;
  for (let i = 0; i < numItems; i++) {
    addItem();
    const n = i + 1;
    if (urls[i]   && urls[i]   !== '--') document.getElementById('url_'   + n).value = urls[i];
    if (descs[i]  && descs[i]  !== '--') document.getElementById('desc_'  + n).value = descs[i].replace(/ \/ /g, '\n');
    if (sizes[i]  && sizes[i]  !== '--') document.getElementById('sizes_' + n).value = sizes[i];
    if (qtys[i] > 0)   document.getElementById('qty_' + n).value = qtys[i];
    if (prices[i] === 0 && qtys[i] > 0) {
      let matchPrice = 0;
      for (let j = 0; j < i; j++) {
        if (urls[j] && urls[i] && urls[j] === urls[i] && urls[j] !== '--' && prices[j] > 0) {
          matchPrice = prices[j]; break;
        }
      }
      if (matchPrice > 0) {
        document.getElementById('orig_price_' + n).value = matchPrice.toFixed(2);
        document.getElementById('price_' + n).value = '0';
      }
    } else if (prices[i] > 0) {
      document.getElementById('price_' + n).value = prices[i];
    }
    calcItem(n);
  }

  calcTotals();
  const info = document.getElementById('parse-info');
  info.style.display = 'block';
  info.textContent = '✓ Filled ' + numItems + ' item' + (numItems > 1 ? 's' : '') + ' — review and adjust as needed';
}

function addItem() {
  itemCount++;
  const n = itemCount;
  const div = document.createElement('div');
  div.className = 'item-block';
  div.id = 'item-block-' + n;
  div.innerHTML = `
    <p class="item-label">Item ${n}</p>
    <div class="field"><label>Image URL</label><input id="url_${n}" placeholder="https://mayorclothing.com/cdn/shop/files/..." /></div>
    <div class="field"><label>Description (verbatim)</label><textarea id="desc_${n}" rows="4"></textarea></div>
    <div class="field"><label>Sizes (e.g. S: 2 - M: 8 - L: 10)</label><input id="sizes_${n}" placeholder="S: 2 - M: 8 - L: 10" /></div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;">
      <div class="field"><label>Qty</label><input id="qty_${n}" type="number" placeholder="24" oninput="calcItem(${n})" /></div>
      <div class="field"><label>Original Price (struck)</label><input id="orig_price_${n}" type="number" step="0.01" placeholder="optional" /></div>
      <div class="field"><label>Actual Price</label><input id="price_${n}" type="number" step="0.01" placeholder="49.00" oninput="calcItem(${n})" /></div>
      <div class="field"><label>Amount (auto)</label><input id="amount_${n}" type="number" step="0.01" readonly /></div>
    </div>`;
  document.getElementById('items-container').appendChild(div);
  document.getElementById('btn-remove').style.display = itemCount > 1 ? '' : 'none';
}

function removeItem() {
  if (itemCount < 2) return;
  document.getElementById('item-block-' + itemCount).remove();
  itemCount--;
  document.getElementById('btn-remove').style.display = itemCount > 1 ? '' : 'none';
  calcTotals();
}

function calcItem(n) {
  const qty   = parseFloat(document.getElementById('qty_' + n).value) || 0;
  const price = parseFloat(document.getElementById('price_' + n).value) || 0;
  const amt   = qty * price;
  document.getElementById('amount_' + n).value = amt > 0 ? amt.toFixed(2) : '';
  calcTotals();
}

function calcTotals() {
  let totalQty = 0, totalAmt = 0;
  for (let i = 1; i <= itemCount; i++) {
    totalQty += parseFloat(document.getElementById('qty_' + i)?.value) || 0;
    totalAmt += parseFloat(document.getElementById('amount_' + i)?.value) || 0;
  }
  document.getElementById('total-qty-display').textContent = totalQty;
  document.getElementById('total-price-display').textContent = '$' + totalAmt.toFixed(2);
  document.getElementById('subtotal').value = totalAmt > 0 ? totalAmt.toFixed(2) : '';
  const shipping = parseFloat(document.getElementById('shipping').value) || 0;
  const grandTotal = totalAmt + shipping;
  document.getElementById('total').value = grandTotal > 0 ? grandTotal.toFixed(2) : '';
}

function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function num(id) { const el = document.getElementById(id); return parseFloat(el?.value) || 0; }
function checked(id) { const el = document.getElementById(id); return el ? el.checked : false; }

let docType = 'confirmation';
function setDocType(type) {
  docType = type;
  document.getElementById('btn-invoice').style.background = type === 'invoice' ? '#1a1a18' : 'white';
  document.getElementById('btn-invoice').style.color = type === 'invoice' ? 'white' : '#1a1a18';
  document.getElementById('btn-invoice').style.borderColor = type === 'invoice' ? '#1a1a18' : '#ccc';
  document.getElementById('btn-confirmation').style.background = type === 'confirmation' ? '#1a1a18' : 'white';
  document.getElementById('btn-confirmation').style.color = type === 'confirmation' ? 'white' : '#1a1a18';
  document.getElementById('btn-confirmation').style.borderColor = type === 'confirmation' ? '#1a1a18' : '#ccc';
  document.getElementById('gen-btn').textContent = type === 'invoice' ? 'Generate Invoice PDF' : 'Generate Order Confirmation PDF';
}

async function generate() {
  const btn = document.getElementById('gen-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status loading';
  status.textContent = 'Generating invoice…';

  const lineItems = [];
  for (let i = 1; i <= itemCount; i++) {
    const qty = num('qty_' + i);
    const desc = val('desc_' + i);
    const sizesVal = val('sizes_' + i);
    if (!qty && !desc) continue;
    const fullDesc = sizesVal ? desc + (desc ? '\n' : '') + sizesVal : desc;
    lineItems.push({
      product: 'Custom Print Polo',
      url: val('url_' + i),
      description: fullDesc,
      quantity: qty,
      orig_price: num('orig_price_' + i) || null,
      price: num('price_' + i),
      amount: num('amount_' + i)
    });
  }

  const payload = {
    type:           docType,
    order_number:   val('order_number'),
    club:           val('club'),
    address:        val('address'),
    ship_date:      val('ship_date'),
    customer_email: val('customer_email'),
    product_page:   val('product_page'),
    payment_link:   val('payment_link'),
    line_items:     lineItems,
    subtotal:       num('subtotal'),
    embroidery:     num('embroidery') || null,
    strike_embroidery: checked('strike_embroidery'),
    art_setup:      num('art_setup') || null,
    strike_art:     checked('strike_art'),
    shipping:       num('shipping'),
    total:          num('total')
  };

  try {
    const res = await fetch('https://mayor-invoice.onrender.com/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Mayor-${docType === 'confirmation' ? 'Order-Confirmation' : 'Invoice'}-${payload.order_number || 'draft'}.pdf`;
    a.click();
    status.className = 'status success';
    status.textContent = '✓ Invoice downloaded!';
  } catch(e) {
    status.className = 'status error';
    status.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

const PO_SIZES = ['XS','S','M','L','XL','XXL','3XL'];

let po_colorways = [];
let po_activeIdx = 0;
let po_cwCounter = 0;

const po_staticDefaults = {
  buttons: 'UNBRANDED clear pearl buttons (do not use Fenix-branded buttons)',
  addressLine1: 'Matt Bartini', addressLine2: 'Mayor Clothing',
  addressLine3: '870 Inman Village Parkway NE', addressLine4: 'Unit 533',
  addressLine5: 'Atlanta, GA 30307', addressLine6: 'USA',
  labelSize: '1.5 centimeters high by 6 centimeters wide',
  labelPlacement: 'Centered on the back neck of the polo collar & sewn on the left and right edge',
  hangtagSize: '10 centimeters high by 4 centimeters wide',
  fusingColor: 'white - hex # ffffff',
  embplacement: 'Left chest standard position – same as second sample polo',
};
const po_cwStatic = {};
function po_getStatic(id, key) { return (po_cwStatic[id] && po_cwStatic[id][key] !== undefined) ? po_cwStatic[id][key] : po_staticDefaults[key]; }
function po_setStatic(id, key, v) { if (!po_cwStatic[id]) po_cwStatic[id] = {}; po_cwStatic[id][key] = v; }

function po_addColorway() {
  po_cwCounter++;
  const id = po_cwCounter;
  po_colorways.push({ id });
  po_activeIdx = po_colorways.length - 1;
  po_renderTabs();
  po_renderPanels();
}
function po_removeColorway(idx) {
  if (po_colorways.length === 1) { alert('At least one colorway is required.'); return; }
  po_colorways.splice(idx, 1);
  if (po_activeIdx >= po_colorways.length) po_activeIdx = po_colorways.length - 1;
  po_renderTabs(); po_renderPanels();
}
function po_setActive(idx) {
  po_activeIdx = idx;
  po_renderTabs();
  document.querySelectorAll('#po-form-area .colorway-panel').forEach((p,i) => p.classList.toggle('active', i === idx));
}

function po_renderTabs() {
  const row = document.getElementById('po-tabs-row');
  row.innerHTML = '';
  po_colorways.forEach((cw, i) => {
    const inp = document.getElementById(`cw-${cw.id}-colorname`);
    const label = inp ? (inp.value || `Colorway ${i+1}`) : `Colorway ${i+1}`;
    const tab = document.createElement('div');
    tab.className = 'po-tab' + (i === po_activeIdx ? ' active' : '');
    tab.textContent = label;
    tab.onclick = () => po_setActive(i);
    row.appendChild(tab);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'po-tab-add-btn';
  addBtn.textContent = '+';
  addBtn.onclick = po_addColorway;
  row.appendChild(addBtn);
}

function po_renderPanels() {
  const area = document.getElementById('po-form-area');
  area.innerHTML = '';
  po_colorways.forEach((cw, i) => {
    const div = document.createElement('div');
    div.className = 'colorway-panel' + (i === po_activeIdx ? ' active' : '');
    div.id = `panel-${cw.id}`;
    div.innerHTML = po_buildPanelHTML(cw.id, i);
    area.appendChild(div);
  });
  po_colorways.forEach(cw => po_initPanel(cw.id));
  po_colorways.forEach(cw => {
    const inp = document.getElementById(`cw-${cw.id}-colorname`);
    if (inp) inp.addEventListener('input', po_renderTabs);
  });
  po_colorways.forEach(cw => po_wireColorSync(cw.id));
}

    </div>`).join('');

    <h2>Colorway ${idx+1}</h2>

          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div>
              <span style="font-size:11px;font-weight:700;color:#555;margin-right:8px;">Pattern</span>
              <span class="static-content" id="cw-${id}-pattern-display" style="font-size:12px;color:#444;">Mayor Polo</span>
            </div>
            <button class="btn-edit" onclick="po_toggleStaticEdit('${id}','pattern')">✎ Edit</button>
          </div>
          <div class="static-edit-form" id="cw-${id}-pattern-form">
            <label>Pattern Label</label><input type="text" id="cw-${id}-patternlabel" value="Mayor Polo">
            <label>Pattern Link</label><input type="text" id="cw-${id}-patternlink" value="${PO_PATTERN_LINK}">

              <button class="btn-save-edit" onclick="po_saveStaticEdit('${id}','pattern')">Save</button>

            </div>
          </div>
        </div>
        <div class="field-row two-col">
          <div><label>Print Name</label><input type="text" id="cw-${id}-printname" placeholder=""></div>
          <div><label>Print Link</label><input type="text" id="cw-${id}-printlink" placeholder=""></div>

function po_toggleStaticEdit(id, key) { document.getElementById(`cw-${id}-${key}-form`).classList.toggle('open'); }
function po_cancelStaticEdit(id, key) { document.getElementById(`cw-${id}-${key}-form`).classList.remove('open'); }
function po_saveStaticEdit(id, key) {
  const v = (fid) => { const el = document.getElementById(fid); return el ? el.value.trim() : ''; };
  if (key === 'pattern') {
    document.getElementById(`cw-${id}-pattern-display`).textContent = v(`cw-${id}-patternlabel`) || 'Mayor Polo';
  } else if (key === 'fusing') {
    const val = v(`cw-${id}-fusing-input`);
    po_setStatic(id, 'fusingColor', val);
    document.getElementById(`cw-${id}-fusing-display`).textContent = `Same color (${val}) and thickness as second sample polo`;
  } else if (key === 'buttons') {
    const val = v(`cw-${id}-buttons-input`);
    po_setStatic(id, 'buttons', val);
    document.getElementById(`cw-${id}-buttons-display`).textContent = val;
  } else if (key === 'mainlabel') {
    const link = v(`cw-${id}-labellink`), size = v(`cw-${id}-labelsize`), placement = v(`cw-${id}-labelplacement`);
    po_setStatic(id, 'labelSize', size); po_setStatic(id, 'labelPlacement', placement);
    document.getElementById(`cw-${id}-mainlabel-display`).innerHTML = `Woven<br>Label File: <a href="${link}" target="_blank">Link</a><br>Size: ${size}<br>Placement: ${placement}`;
  } else if (key === 'hangtag') {
    const link = v(`cw-${id}-hangtaglink`), size = v(`cw-${id}-hangtagsize`);
    po_setStatic(id, 'hangtagSize', size);
    document.getElementById(`cw-${id}-hangtag-display`).innerHTML = `Hang Tag File: <a href="${link}" target="_blank">Link</a> (do not use Fenix-branded hang tags)<br>Size: ${size}`;
  } else if (key === 'carelabel') {
    // nothing to update in display, just closes
  } else if (key === 'address') {
    ['1','2','3','4','5','6'].forEach(n => po_setStatic(id, `addressLine${n}`, v(`cw-${id}-addr${n}`)));
    document.getElementById(`cw-${id}-address-display`).innerHTML = ['1','2','3','4','5','6'].map(n => po_getStatic(id,`addressLine${n}`)).filter(Boolean).join('<br>');
  } else if (key === 'embplacement') {
    const val = v(`cw-${id}-embplacement-input`);
    po_setStatic(id, 'embplacement', val);
    document.getElementById(`cw-${id}-embplacement-display`).textContent = val;
  }
  document.getElementById(`cw-${id}-${key}-form`).classList.remove('open');
}

function po_syncPoloThread(id) {
  const name = (document.getElementById(`cw-${id}-bgcolorname`) || {}).value || '';
  const hex  = (document.getElementById(`cw-${id}-bgcolorhex`)  || {}).value || '';
  const isWhite = name.trim().toLowerCase() === 'white';
  const out = [name, hex ? `(hex # ${hex})` : ''].filter(Boolean).join(' ');
  const field = document.getElementById(`cw-${id}-polothreadcolor`);
  if (field) field.value = out ? out + (isWhite ? ' – same as second sample polo' : '') : '';
}
function po_wireColorSync(id) {
  ['bgcolorname','bgcolorhex'].forEach(fid => {
    const el = document.getElementById(`cw-${id}-${fid}`);
    if (el) el.addEventListener('input', () => po_syncPoloThread(id));
  });
}

function po_updateQty(id) {
  let total = 0;
  PO_SIZES.forEach(s => { const el = document.getElementById(`cw-${id}-size-${s}`); const v = el ? parseInt(el.value, 10) : 0; if (!isNaN(v) && v > 0) total += v; });
  const qtyEl = document.getElementById(`cw-${id}-qty`);
  if (qtyEl) qtyEl.value = total > 0 ? `${total} total polos` : '';
}

function po_initPanel(id) {
  const embC = document.getElementById(`cw-${id}-embfiles`);
  if (embC && embC.children.length === 0) po_addEmbFile(id);
  const tcC = document.getElementById(`cw-${id}-threadcolors`);
  if (tcC && tcC.children.length === 0) po_addThreadColor(id);
  const pcC = document.getElementById(`cw-${id}-printcolors`);
  if (pcC && pcC.children.length === 0) po_addPrintColor(id);
  PO_SIZES.forEach(s => { const el = document.getElementById(`cw-${id}-size-${s}`); if (el) el.addEventListener('input', () => po_updateQty(id)); });
}

function po_previewMockup(id) {
  const url = document.getElementById(`cw-${id}-mockupurl`).value;
  const img = document.getElementById(`cw-${id}-mockuppreview`);
  if (url) { img.src = url; img.style.display = 'block'; } else img.style.display = 'none';
}

function po_collectData(id) {
  const v = (fid) => { const el = document.getElementById(`cw-${id}-${fid}`); return el ? el.value.trim() : ''; };
  const sizes = {};
  PO_SIZES.forEach(s => { const val = v(`size-${s}`); if (val && val !== '0') sizes[s] = val; });
  const printColors = [];
  const pcC = document.getElementById(`cw-${id}-printcolors`);
  if (pcC) pcC.querySelectorAll('.color-row').forEach(row => { const inputs = row.querySelectorAll('input'); const name = inputs[0].value.trim(), hex = inputs[1].value.trim(); if (name || hex) printColors.push({ name, hex }); });
  const embfiles = [];
  const efC = document.getElementById(`cw-${id}-embfiles`);
  if (efC) efC.querySelectorAll('.emb-file-row').forEach(row => {
    const labelEl = row.querySelector('[data-role="label"]');
    const urlEl   = row.querySelector('[data-role="url"]');
    const label = labelEl ? labelEl.value.trim() : '';
    const url   = urlEl   ? urlEl.value.trim()   : '';
    if (url) embfiles.push({ label, url });
  });
  const threadColors = [];
  const tcC = document.getElementById(`cw-${id}-threadcolors`);
  if (tcC) tcC.querySelectorAll('.color-row').forEach(row => { const inputs = row.querySelectorAll('input'); const name = inputs[0].value.trim(), hex = inputs[1].value.trim(); if (name || hex) threadColors.push({ name, hex }); });
  return {
    po: v('po'), club: v('club'), colorname: v('colorname'),
    datelabel: v('datelabel'), datevalue: v('datevalue'),
    patternlabel: v('patternlabel') || 'Mayor Polo', patternlink: v('patternlink') || PO_PATTERN_LINK,
    printname: v('printname'), printlink: v('printlink'),
    repeatsizeh: v('repeatsizeh'), repeatsizew: v('repeatsizew'), stroke: v('stroke'),
    printColors, bgcolorname: v('bgcolorname'), bgcolorhex: v('bgcolorhex'),
    qty: v('qty'), sizes, mockupurl: v('mockupurl'),
    embdesc: v('embdesc'), embfiles, threadColors,
    embplacement: po_getStatic(id,'embplacement'),
    embsizeh: v('embsizeh'), embsizew: v('embsizew'),
    polothreadcolor: v('polothreadcolor'),
    fusingColor: po_getStatic(id,'fusingColor'), buttons: po_getStatic(id,'buttons'),
    labellink: v('labellink') || PO_LABEL_FILE_LINK,
    labelsize: v('labelsize') || po_getStatic(id,'labelSize'),
    labelplacement: v('labelplacement') || po_getStatic(id,'labelPlacement'),
    labelimgurl: v('labelimgurl'),
    carelabelimgurl: v('carelabelimgurl'),
    hangtaglink: v('hangtaglink') || PO_HANGTAG_FILE_LINK,
    hangtagsize: v('hangtagsize') || po_getStatic(id,'hangtagSize'),
    hangtagimgurl: v('hangtagimgurl'),
    addr1: po_getStatic(id,'addressLine1'), addr2: po_getStatic(id,'addressLine2'),
    addr3: po_getStatic(id,'addressLine3'), addr4: po_getStatic(id,'addressLine4'),
    addr5: po_getStatic(id,'addressLine5'), addr6: po_getStatic(id,'addressLine6'),
  };
}

function po_buildPDFPage(d) {
  // Blue clickable link
  const lnk = (url, text) => url ? `<a href="${url}" style="color:#1155cc;text-decoration:underline;">${text}</a>` : text;

  // Hex code as icolorpalette hyperlink — no space between # and hex digits
  const hexLnk = (hex) => {
    if (!hex) return '';
    const clean = hex.replace(/\s/g,'').replace(/^#+/,'');
    return `<a href="https://icolorpalette.com/color/${clean}" style="color:#1155cc;text-decoration:underline;">hex #${clean}</a>`;
  };

  // Normalize a hex value entered by user (strip spaces/hash for URL, keep clean display)
  const colorToken = (name, hex) => {
    let s = name ? `<span style="color:#222;">${name}</span>` : '';
    if (hex) {
      const clean = hex.replace(/\s/g,'').replace(/^#+/,'');
      s += (s ? ' ' : '') + `(<a href="https://icolorpalette.com/color/${clean}" style="color:#1155cc;text-decoration:underline;">hex #${clean}</a>)`;
    }
    return s;
  };

  const sizeLines = Object.entries(d.sizes)
    .map(([s,q]) => `<div style="margin-bottom:1px;">${s}: ${q}</div>`).join('');

  const printColorStr = d.printColors.map(c => colorToken(c.name, c.hex)).join(' and ');
  const bgToken = colorToken(d.bgcolorname, d.bgcolorhex);
  const colorLine = printColorStr ? printColorStr + (bgToken ? ` on ${bgToken}` : '') : bgToken;

  const embFileParts = d.embfiles.map(f => {
    const label = f.label || '';
    return label ? `${label} (${lnk(f.url, f.url)})` : lnk(f.url, f.url);
  }).join(', ');

  const tcText = d.threadColors.map(tc => colorToken(tc.name, tc.hex)).join(', ');

  // Re-linkify hex codes in polo thread string
  const poloThreadDisplay = d.polothreadcolor.replace(/hex\s*#\s*([0-9a-fA-F]{3,8})/g,
    (m, h) => `<a href="https://icolorpalette.com/color/${h}" style="color:#1155cc;text-decoration:underline;">hex #${h}</a>`);

  const fusingHex = d.fusingColor.replace(/hex\s*#\s*([0-9a-fA-F]{3,8})/g,
    (m, h) => `<a href="https://icolorpalette.com/color/${h}" style="color:#1155cc;text-decoration:underline;">hex #${h}</a>`);
  const fusingDisplay = `Same color (${fusingHex}) and thickness as second sample polo`;

  const mockupHTML = d.mockupurl
    ? `<div style="text-align:center;margin-top:8px;"><img src="${d.mockupurl}" style="max-width:220px;max-height:220px;" crossorigin="anonymous"></div>` : '';

  // Material image helper — use hardcoded base64 images
  const matImg = (b64) => b64
    ? `<img src="${b64}" style="width:80px;height:54px;object-fit:cover;border:1px solid #ddd;flex-shrink:0;margin-left:10px;">`
    : '';

  return `<div class="pdf-page" style="width:1200px;background:white;font-family:Arial,sans-serif;font-size:11.5px;color:#222;padding:28px 36px 20px 36px;line-height:1.45;">
    <div style="text-align:center;font-size:21px;font-weight:bold;font-family:Arial,sans-serif;color:#222;margin-bottom:3px;">Mayor – PO #${d.po} – ${d.club}</div>
    <div style="text-align:center;font-size:13px;color:#222;margin-bottom:10px;font-family:Arial,sans-serif;">${d.colorname}</div>
    <hr style="border:none;border-top:1px solid #aaa;margin-bottom:14px;">
    <div style="display:flex;gap:0;">

      <!-- LEFT COLUMN -->
      <div style="flex:0 0 400px;padding-right:22px;border-right:1px solid #bbb;">
        <div style="margin-bottom:5px;"><b>${d.datelabel}:</b> ${d.datevalue}</div>
        <div style="margin-bottom:5px;"><b>Pattern:</b> ${lnk(d.patternlink, d.patternlabel)} – same as second sample polo</div>
        <div style="margin-bottom:5px;"><b>Print:</b> ${lnk(d.printlink, d.printname)}</div>
        <div style="margin-bottom:5px;"><b>Repeat Size:</b> ${d.repeatsizeh} inches high by ${d.repeatsizew} inches wide</div>
        <div style="margin-bottom:5px;"><b>Stroke Thickness:</b> ${d.stroke} inches</div>
        <div style="margin-bottom:5px;"><b>Color:</b> ${colorLine}</div>
        <div style="margin-bottom:3px;"><b>Quantity:</b> ${d.qty}</div>
        <div style="margin-left:10px;margin-bottom:8px;">${sizeLines}</div>

        <div style="text-align:center;font-weight:bold;font-size:12px;margin:10px 0 6px;">Embroidery</div>
        <div style="margin-bottom:5px;"><b>Embroidery File:</b> ${d.embdesc}${embFileParts ? ' (' + embFileParts + ')' : ''}</div>
        <div style="margin-bottom:5px;"><b>Thread Color(s):</b> ${tcText}</div>
        <div style="margin-bottom:5px;"><b>Placement:</b> ${d.embplacement}</div>
        <div style="margin-bottom:5px;"><b>Size:</b> ${d.embsizeh} inches high by ${d.embsizew} inches wide</div>

        <div style="text-align:center;font-weight:bold;font-size:12px;margin:10px 0 6px;">Mockup</div>

async function po_generateAllPDFs() {
  const btn = document.getElementById('po-download-btn');
  btn.textContent = 'Generating...';
  btn.disabled = true;
  try {
    const { jsPDF } = window.jspdf;
    const d0 = po_collectData(po_colorways[0].id);
    const filename = `Mayor_PO_${d0.po||'XX'}_${(d0.club||'Order').replace(/[^a-z0-9]/gi,'_')}.pdf`;

    // Build all pages as HTML
    const container = document.getElementById('pdf-pages-container');
    container.innerHTML = '';

    // Render each colorway as a separate div
    const pageEls = [];
    for (let i = 0; i < po_colorways.length; i++) {
      const data = po_collectData(po_colorways[i].id);
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:block;page-break-after:always;';
      wrapper.innerHTML = po_buildPDFPage(data);
      container.appendChild(wrapper);
      pageEls.push(wrapper);
    }

    // Use jsPDF.html() which preserves clickable links
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1200, 850], hotfixes: ['px_scaling'] });

    const renderPage = (idx) => new Promise((resolve) => {
      if (idx >= po_colorways.length) { resolve(); return; }
      const data = po_collectData(po_colorways[idx].id);
      const tempDiv = document.createElement('div');
      tempDiv.style.cssText = 'position:absolute;left:0;top:0;';
      tempDiv.innerHTML = po_buildPDFPage(data);
      container.innerHTML = '';
      container.appendChild(tempDiv);

      if (idx > 0) pdf.addPage([1200, 850], 'landscape');

      pdf.html(tempDiv.querySelector('.pdf-page'), {
        callback: () => resolve(),
        x: 0, y: 0,
        html2canvas: { scale: 1, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', logging: false },
        autoPaging: false,
        width: 1200,
        windowWidth: 1200,
      });
    });

    for (let i = 0; i < po_colorways.length; i++) {
      await renderPage(i);
    }

    container.innerHTML = '';
    pdf.save(filename);
  } catch(err) {
    console.error(err);
    alert('PDF generation failed: ' + err.message);
  }
  btn.textContent = '⬇ Download PDF';
  btn.disabled = false;
}

// Init PO generator
po_addColorway();
